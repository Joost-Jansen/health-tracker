# Same shape as stock-tracker's CI: a backend and a frontend job on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            api/requirements.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      # A clean environment: tests/test_web_requirements.py checks that the web image's api/requirements.txt has
      # everything the app imports (it only fails locally when other packages happen to be installed).
      - name: Tests
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Translations
        run: npm run check:i18n
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
