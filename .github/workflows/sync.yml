name: sync

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC = 06:00 Europe/Amsterdam in summer, 05:00 in winter
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill vanaf (YYYY-MM-DD); leeg = alleen nieuwe data"
        required: false
      source:
        description: "Bron"
        type: choice
        options: [all, strava, garmin]
        default: all

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync Garmin en Strava
        id: sync
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          TOKEN_OUT_DIR: ${{ runner.temp }}/tokens
          SINCE: ${{ inputs.since }}
          SOURCE: ${{ inputs.source || 'all' }}
        run: |
          mkdir -p "$TOKEN_OUT_DIR"
          args=(--source "$SOURCE")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          python tools/sync.py "${args[@]}"

      - name: Vernieuwde tokens terugschrijven naar secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          dir="$RUNNER_TEMP/tokens"
          for f in "$dir"/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ -z "$GH_TOKEN" ]; then
              echo "::warning::$name is vernieuwd maar SECRETS_PAT ontbreekt; volgende sync kan falen"
              continue
            fi
            gh secret set "$name" --repo "$GITHUB_REPOSITORY" < "$f"
            echo "secret $name bijgewerkt"
          done
          rm -rf "$dir"

      - name: Commit data
        run: |
          git config user.name "training-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data routes summary
          if git diff --cached --quiet; then
            echo "geen nieuwe data"
            exit 0
          fi
          git commit -q -m "sync: $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')"
          git pull -q --rebase origin main
          git push -q origin main

      - name: Faal zichtbaar als een bron mislukte
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Sync van een bron is mislukt; zie stap 'Sync Garmin en Strava'"
          exit 1
